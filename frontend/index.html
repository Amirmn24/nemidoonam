<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>ویرونا · Vyrvona</title>
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/favicon.ico" />
    <script>
      (function () {
        try {
          var themeKey = 'vyrvona.theme'
          var storedTheme = localStorage.getItem(themeKey)
          var theme =
            storedTheme === 'dark' || storedTheme === 'light'
              ? storedTheme
              : window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light'
          document.documentElement.setAttribute('data-theme', theme)
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light')
        }
        try {
          var localeKey = 'vyrvona.locale'
          var storedLocale = localStorage.getItem(localeKey)
          var locale = storedLocale === 'en' || storedLocale === 'fa' ? storedLocale : 'fa'
          document.documentElement.lang = locale === 'en' ? 'en' : 'fa'
          document.documentElement.dir = locale === 'en' ? 'ltr' : 'rtl'
        } catch (e) {
          document.documentElement.lang = 'fa'
          document.documentElement.dir = 'rtl'
        }
      })()
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
